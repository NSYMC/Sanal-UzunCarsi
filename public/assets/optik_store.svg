<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="optikBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1926" />
      <stop offset="100%" stop-color="#1b2a3f" />
    </linearGradient>
    <linearGradient id="woodShelf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3826" />
      <stop offset="50%" stop-color="#7a4b33" />
      <stop offset="100%" stop-color="#5c3826" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c84f" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="lensShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(100, 200, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(50, 100, 200, 0.5)" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="360" fill="url(#optikBg)" />
  <rect x="30" y="30" width="540" height="300" rx="12" fill="#141e2d" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Warm Shelf Lights -->
  <circle cx="150" cy="50" r="80" fill="rgba(255, 220, 150, 0.08)" filter="blur(20px)" />
  <circle cx="450" cy="50" r="80" fill="rgba(255, 220, 150, 0.08)" filter="blur(20px)" />
  
  <!-- Shelves -->
  <rect x="60" y="110" width="480" height="10" rx="3" fill="url(#woodShelf)" />
  <rect x="60" y="210" width="480" height="10" rx="3" fill="url(#woodShelf)" />
  <rect x="60" y="300" width="480" height="10" rx="3" fill="url(#woodShelf)" />

  <!-- Top Shelf Glasses 1 (Aviator/Sunglasses) -->
  <g transform="translate(100, 70)">
    <path d="M 10 15 Q 35 5 60 15 Q 55 35 35 38 Q 15 35 10 15 Z" fill="url(#lensShine)" stroke="#d4af37" stroke-width="2.5" />
    <path d="M 75 15 Q 100 5 125 15 Q 120 35 100 38 Q 80 35 75 15 Z" fill="url(#lensShine)" stroke="#d4af37" stroke-width="2.5" />
    <path d="M 60 15 Q 67.5 12 75 15" stroke="#d4af37" stroke-width="2.5" fill="none" />
    <path d="M 40 10 Q 67.5 7 95 10" stroke="#d4af37" stroke-width="1.5" fill="none" />
    <path d="M 10 16 L -5 18" stroke="#d4af37" stroke-width="2" />
    <path d="M 125 16 L 140 18" stroke="#d4af37" stroke-width="2" />
  </g>

  <!-- Top Shelf Glasses 2 (Modern Rectangular) -->
  <g transform="translate(330, 72)">
    <rect x="10" y="10" width="55" height="24" rx="4" fill="rgba(20,40,60,0.8)" stroke="#4a90e2" stroke-width="2.5" />
    <rect x="75" y="10" width="55" height="24" rx="4" fill="rgba(20,40,60,0.8)" stroke="#4a90e2" stroke-width="2.5" />
    <path d="M 65 18 L 75 18" stroke="#4a90e2" stroke-width="2.5" />
    <path d="M 10 14 L -2 16" stroke="#4a90e2" stroke-width="2" />
    <path d="M 130 14 L 142 16" stroke="#4a90e2" stroke-width="2" />
  </g>

  <!-- Middle Shelf Glasses (Hero Browline / Clubmaster) -->
  <g transform="translate(200, 145) scale(1.4)">
    <!-- Left Frame -->
    <path d="M 10 12 Q 35 6 60 12 L 56 30 Q 35 34 14 30 Z" fill="url(#lensShine)" stroke="#111" stroke-width="3" />
    <path d="M 8 10 Q 35 3 62 10" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 14 30 Q 35 34 56 30" stroke="#d4af37" stroke-width="2" fill="none" />
    <!-- Right Frame -->
    <path d="M 76 12 Q 101 6 126 12 L 122 30 Q 101 34 80 30 Z" fill="url(#lensShine)" stroke="#111" stroke-width="3" />
    <path d="M 74 10 Q 101 3 128 10" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 80 30 Q 101 34 122 30" stroke="#d4af37" stroke-width="2" fill="none" />
    <!-- Bridge & Temples -->
    <path d="M 60 13 Q 68 9 76 13" stroke="#d4af37" stroke-width="3" fill="none" />
    <circle cx="12" cy="11" r="1.5" fill="#d4af37" />
    <circle cx="124" cy="11" r="1.5" fill="#d4af37" />
  </g>

  <!-- Badge / Kicker -->
  <g transform="translate(50, 48)">
    <rect width="130" height="26" rx="6" fill="rgba(73, 111, 189, 0.25)" stroke="rgba(73, 111, 189, 0.5)" />
    <text x="65" y="17" fill="#8cb2ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">OPTİK &amp; GÖZLÜK</text>
  </g>
</svg>
