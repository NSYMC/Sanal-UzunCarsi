<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mawusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141208" />
      <stop offset="100%" stop-color="#241e0a" />
    </linearGradient>
    <linearGradient id="goldMawus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c7324" />
    </linearGradient>
    <linearGradient id="diamondSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cceeff" />
      <stop offset="100%" stop-color="#80ccff" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#mawusBg)" />
  <rect x="30" y="30" width="540" height="300" rx="12" fill="#1c1808" stroke="rgba(212,175,55,0.2)" stroke-width="1.5" />

  <circle cx="300" cy="160" r="140" fill="rgba(212, 175, 55, 0.08)" filter="blur(30px)" />

  <!-- Velvet Stand -->
  <path d="M 200 270 L 230 200 L 370 200 L 400 270 Z" fill="#2d121c" stroke="#d4af37" stroke-width="1.5" />

  <!-- Solitaire Diamond Ring (Hero) -->
  <g transform="translate(260, 110)">
    <!-- Band -->
    <ellipse cx="40" cy="70" rx="35" ry="30" fill="none" stroke="url(#goldMawus)" stroke-width="8" />
    <!-- Prongs -->
    <path d="M 30 42 L 35 32 L 45 32 L 50 42 Z" fill="url(#goldMawus)" />
    <!-- Diamond -->
    <path d="M 25 28 L 40 10 L 55 28 L 40 38 Z" fill="url(#diamondSpark)" stroke="#ffffff" stroke-width="1" />
    <path d="M 30 28 L 40 10 L 50 28" fill="none" stroke="rgba(255,255,255,0.7)" />
    <polygon points="40,2 43,8 50,8 44,13 47,20 40,15 33,20 36,13 30,8 37,8" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <g transform="translate(180, 120)" fill="#ffffff" opacity="0.8">
    <polygon points="10,0 12,7 19,10 12,13 10,20 8,13 1,10 8,7" />
  </g>
  <g transform="translate(410, 140)" fill="#ffffff" opacity="0.8">
    <polygon points="10,0 12,7 19,10 12,13 10,20 8,13 1,10 8,7" />
  </g>

  <!-- Badge / Kicker -->
  <g transform="translate(50, 48)">
    <rect width="180" height="26" rx="6" fill="rgba(212, 175, 55, 0.25)" stroke="rgba(212, 175, 55, 0.5)" />
    <text x="90" y="17" fill="#ffd866" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">KUYUMCULUK &amp; ALTIN</text>
  </g>
</svg>
